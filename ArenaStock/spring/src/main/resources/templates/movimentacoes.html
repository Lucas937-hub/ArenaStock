<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ArenaStock | Movimentações</title>

    <link rel="stylesheet" href="/css/global.css">

    <link rel="stylesheet" href="/css/dashboard-layout.css">

    <link rel="stylesheet" href="/css/movimentacoes.css">

</head>

<body>

<div class="app-shell">

    <!-- ===================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================== -->

    <aside class="sidebar">

        <div>

            <div class="sidebar-brand">

                <a th:href="@{/dashboard}">

                    <div class="logo-mark">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2.2">

                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>

                            <path d="M2 17l10 5 10-5"/>

                            <path d="M2 12l10 5 10-5"/>

                        </svg>

                    </div>

                    <span class="brand-name">

                        ArenaStock

                    </span>

                </a>

            </div>

            <nav class="sidebar-nav">

                <div class="sidebar-section-label">

                    Principal

                </div>

                <a class="sidebar-link"
                   th:href="@{/dashboard}">

                    <span class="icon">🏠</span>

                    <span>Dashboard</span>

                </a>

                <a class="sidebar-link"
                   th:href="@{/produtos}">

                    <span class="icon">📦</span>

                    <span>Produtos</span>

                </a>

                <a class="sidebar-link"
                   th:href="@{/categorias}">

                    <span class="icon">🗂️</span>

                    <span>Categorias</span>

                </a>

                <a class="sidebar-link active"
                   th:href="@{/movimentacoes}">

                    <span class="icon">🔄</span>

                    <span>Movimentações</span>

                </a>

                <a class="sidebar-link"
                   th:href="@{/perfil}">

                    <span class="icon">👤</span>

                    <span>Perfil</span>

                </a>

            </nav>

        </div>

        <div class="sidebar-footer">

            <a class="sidebar-link sidebar-logout"
               th:href="@{/logout}">

                <span class="icon">🚪</span>

                <span>Sair</span>

            </a>

        </div>

    </aside>

    <!-- ===================================== -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ===================================== -->

    <div class="main-area">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="topbar-title">

                Controle de

                <strong>Movimentações</strong>

            </div>

            <div class="topbar-search">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <circle cx="11"
                            cy="11"
                            r="8"/>

                    <line x1="21"
                          y1="21"
                          x2="16.65"
                          y2="16.65"/>

                </svg>

                <input
                        class="input-field"
                        type="text"
                        placeholder="Pesquisar movimentações...">

            </div>

            <div class="topbar-user">

                <div class="avatar-circle"
                     th:text="${#strings.substring(usuarioLogado.nome,0,1)}">
                </div>

                <span class="user-name"
                      th:text="${usuarioLogado.nome}">

                </span>

            </div>

        </header>

        <!-- CONTEÚDO -->

        <main class="content">

            <!-- ===================================== -->
<!-- HEADER DA PÁGINA -->
<!-- ===================================== -->

<div class="page-header">

    <div>

        <h1>Movimentações</h1>

        <p>

            Controle todas as entradas e saídas do estoque.

        </p>

    </div>

    <button id="abrirModalMovimentacao" class="btn btn-primary">

        + Nova Movimentação

    </button>

</div>


<!-- ===================================== -->
<!-- TOOLBAR -->
<!-- ===================================== -->

<div class="toolbar">

    <input
            id="pesquisaMovimentacao"
            class="input-field"
            type="text"
            placeholder="Pesquisar movimentação...">

    <select class="input-field">

        <option>Todos os Produtos</option>

        <option th:each="produto : ${produtos}" th:text="${produto.nome}"></option>

    </select>

    <select class="input-field">

        <option>Todos os Tipos</option>

        <option>Entrada</option>

        <option>Saída</option>

    </select>

</div>


<!-- ===================================== -->
<!-- TABELA -->
<!-- ===================================== -->

<div class="table-wrapper">

    <table class="data-table">

        <thead>

        <tr>

            <th>Produto</th>

            <th>Tipo</th>

            <th>Quantidade</th>

            <th>Responsável</th>

            <th>Data</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="mov : ${movimentacoes}">

            <td th:text="${mov.produto.nome}"></td>

            <td>

                <span th:classappend="${mov.tipo.name() == 'ENTRADA'} ? 'badge badge-entrada' : 'badge badge-saida'"
                      th:text="${mov.tipo.name() == 'ENTRADA'} ? 'Entrada' : 'Saída'">
                </span>

            </td>

            <td th:text="${(mov.tipo.name() == 'ENTRADA' ? '+' : '-') + mov.quantidade}"></td>

            <td th:text="${mov.usuario.nome}"></td>

            <td th:text="${#temporals.format(mov.dataHora, 'dd/MM/yyyy HH:mm')}"></td>

        </tr>

        <tr th:if="${#lists.isEmpty(movimentacoes)}">

            <td colspan="5">Nenhuma movimentação registrada.</td>

        </tr>

        </tbody>

    </table>

</div>

<!-- ===================================== -->
<!-- MODAL NOVA MOVIMENTAÇÃO -->
<!-- ===================================== -->

<div id="modalMovimentacao" class="modal-overlay" style="display:none;">

    <div class="modal-box card">

        <h3>Nova Movimentação</h3>

        <form id="formMovimentacao">

            <div class="input-group">

                <label>Produto</label>

                <select id="produtoMovimentacao" class="input-field">

                    <option value="">Selecione um produto</option>

                    <option th:each="produto : ${produtos}"
                            th:value="${produto.id}"
                            th:text="${produto.nome}"></option>

                </select>

            </div>

            <div class="form-row">

                <div class="input-group">

                    <label>Tipo</label>

                    <select id="tipoMovimentacao" class="input-field">

                        <option value="ENTRADA">Entrada</option>

                        <option value="SAIDA">Saída</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Quantidade</label>

                    <input
                        id="quantidadeMovimentacao"
                        type="number"
                        min="1"
                        class="input-field"
                        placeholder="0">

                </div>

            </div>

            <div class="form-actions">

                <button
                    id="fecharModalMovimentacao"
                    type="button"
                    class="btn btn-secondary">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Registrar Movimentação

                </button>

            </div>

        </form>

    </div>

</div>

</main>

<!-- ===================================== -->
<!-- FOOTER -->
<!-- ===================================== -->

<footer class="app-footer">

    ArenaStock © 2026

</footer>

</div>

</div>

<script>

// Botao "+ Nova Movimentação" que abre o modal
const abrirModalMovimentacao = document.getElementById("abrirModalMovimentacao");
// Botao "Cancelar" que fecha o modal
const fecharModalMovimentacao = document.getElementById("fecharModalMovimentacao");
// A caixa (overlay) do modal inteiro
const modalMovimentacao = document.getElementById("modalMovimentacao");
// O formulario dentro do modal
const formMovimentacao = document.getElementById("formMovimentacao");

// Select com a lista de produtos
const produtoMovimentacao = document.getElementById("produtoMovimentacao");
// Select com o tipo (Entrada/Saida)
const tipoMovimentacao = document.getElementById("tipoMovimentacao");
// Campo numerico da quantidade
const quantidadeMovimentacao = document.getElementById("quantidadeMovimentacao");

// Quando clica em "+ Nova Movimentação"...
abrirModalMovimentacao.addEventListener("click", () => {
    // Limpa o formulario
    formMovimentacao.reset();
    // Mostra o modal
    modalMovimentacao.style.display = "flex";
});

// Quando clica em "Cancelar"...
fecharModalMovimentacao.addEventListener("click", () => {
    // Esconde o modal
    modalMovimentacao.style.display = "none";
});

// Quando clica em qualquer lugar da pagina...
window.addEventListener("click", function (event) {
    // Se o clique foi no fundo escurecido (fora da caixa do modal)...
    if (event.target === modalMovimentacao) {
        // Esconde o modal
        modalMovimentacao.style.display = "none";
    }
});

// Registrar movimentação (usa a API REST ja existente em /api/movimentacao)
// Quando o formulario do modal for enviado...
formMovimentacao.addEventListener("submit", function (event) {
    // Impede o comportamento padrao do form (recarregar a pagina inteira)
    event.preventDefault();

    // Se nenhum produto foi selecionado, avisa e para aqui
    if (!produtoMovimentacao.value) {
        alert("Selecione um produto.");
        return;
    }

    // Chama a API REST enviando um JSON com produto, tipo e quantidade
    fetch("/api/movimentacao", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            // So precisa mandar o id do produto (o backend busca o resto)
            produto: { id: Number(produtoMovimentacao.value) },
            // Precisa ser exatamente "ENTRADA" ou "SAIDA" (bate com o enum do backend)
            tipo: tipoMovimentacao.value,
            // Converte o texto do campo pra numero
            quantidade: Number(quantidadeMovimentacao.value)
        })
    })
    .then(async resposta => {
        // Se deu certo, recarrega a pagina pra mostrar a movimentacao nova na lista
        if (resposta.ok) {
            window.location.reload();
        } else {
            // Se deu erro (ex: estoque insuficiente), le a mensagem devolvida pela API
            const erro = await resposta.json();
            // Mostra a mensagem de erro, ou uma generica se nao vier nenhuma
            alert(erro.erro || "Não foi possível registrar a movimentação.");
        }
    });
});

// Pesquisar movimentação pelo nome do produto
// Pega o campo de texto de pesquisa da toolbar
const pesquisaMovimentacao = document.getElementById("pesquisaMovimentacao");
// So continua se o campo realmente existir na pagina
if (pesquisaMovimentacao) {
    // Toda vez que o usuario digita algo no campo de pesquisa...
    pesquisaMovimentacao.addEventListener("input", function () {
        // Pega o texto digitado, tudo em minusculo
        const termo = this.value.toLowerCase();
        // Para cada linha da tabela...
        document.querySelectorAll(".data-table tbody tr").forEach(linha => {
            // Pega a primeira coluna da linha (nome do produto)
            const nomeCelula = linha.querySelector("td");
            const nomeTexto = nomeCelula ? nomeCelula.textContent.toLowerCase() : "";
            // Mostra a linha se o nome contem o termo digitado, senao esconde
            linha.style.display = nomeTexto.includes(termo) ? "" : "none";
        });
    });
}

</script>

</body>

</html>
